name: Check for package updates

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to check (blank = all)"
        required: false
        default: ""

concurrency:
  group: check-updates
  cancel-in-progress: false

permissions:
  actions: write # start the build for an update PR that merged itself
  contents: write # push update/* branches, merge routine -bin PRs
  pull-requests: write # open, close and merge update PRs
  packages: read # pull the builder image
  statuses: write # post test build commit status

jobs:
  check:
    name: Check AUR and upstream versions
    # Lightweight: gh, jq and git are preinstalled; vercmp comes from
    # scripts/lib/vercmp.sh since slim has no pacman (and no job containers).
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          # shellcheck disable=SC2086 # word-split the package list on purpose
          scripts/ci/check-updates.sh $PACKAGES

  update:
    name: Update ${{ matrix.package }} to ${{ matrix.kind == 'aur' && 'AUR ' || '' }}${{ matrix.version }}
    needs: check
    if: needs.check.outputs.updates != '[]' && needs.check.outputs.updates != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # archlinux:base-devel with the tooling preinstalled (container/Containerfile).
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.updates) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Registers [aurstrich] first, so the update below syncs it too.
      - name: Prepare build user
        env:
          # Read [aurstrich] straight from B2 (Bot Fight Mode blocks runners).
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: scripts/ci/setup-builder.sh

      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Bump, test-build and open PR
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          KIND: ${{ matrix.kind }}
          VERSION: ${{ matrix.version }}
          COMMIT: ${{ matrix.commit }}
        run: |
          if [[ "$KIND" == "aur" ]]; then
            scripts/ci/propose-aur.sh "$PACKAGE" "$COMMIT"
          else
            scripts/ci/propose-update.sh "$PACKAGE" "$VERSION"
          fi

      # Merging the PR within the retention period publishes these packages
      # instead of building them again (scripts/lib/prebuilt.sh).
      - name: Upload test build for reuse
        if: steps.propose.outputs.prebuilt != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.propose.outputs.prebuilt }}
          path: .repo/prebuilt.tar
          include-hidden-files: true
          if-no-files-found: error
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 7

      # A -bin package whose only change is pkgver, pkgrel and checksums,
      # with a passing test build, merges itself and starts its build, which
      # reuses the test build uploaded above. Everything else waits for review.
      - name: Merge routine -bin updates
        if: steps.propose.outputs.automerge == 'true' && steps.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.propose.outputs.pr }}
          PACKAGE: ${{ matrix.package }}
        run: scripts/ci/automerge.sh "$PR" "$PACKAGE"

  # Tell someone when the check itself breaks. A failed test build opens a
  # draft PR already, so the update jobs are not watched.
  report:
    name: Report result
    needs: check
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            scripts/ci/report-failure.sh job-ok "Check for package updates" "$RUN_URL"
          else
            scripts/ci/report-failure.sh job-fail "Check for package updates" "$RUN_URL"
          fi
