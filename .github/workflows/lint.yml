name: Lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "packages/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read

jobs:
  shellcheck:
    name: shellcheck
    if: "!startsWith(github.head_ref, 'aur/') && !startsWith(github.head_ref, 'update/')"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          mapfile -t files < <(git ls-files 'scripts/*.sh' 'scripts/**/*.sh')
          shellcheck --external-sources --severity=style "${files[@]}"

  pkgbuild:
    name: PKGBUILD sanity
    if: "!startsWith(github.head_ref, 'aur/') && !startsWith(github.head_ref, 'update/')"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          base=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_REF" ]]; then
            candidate="origin/${BASE_REF}"
            if git rev-parse --verify "$candidate" >/dev/null 2>&1; then
              base="$candidate"
            fi
          elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${EVENT_BEFORE}^{commit}" >/dev/null 2>&1; then
              base="$EVENT_BEFORE"
            fi
          fi

          if [[ -z "$base" ]]; then
            echo "Base commit unavailable or unusable; falling back to checking all packages."
            exec scripts/ci/lint-packages.sh
          fi

          echo "Diffing packages/ against base ${base}"
          mapfile -t changed_files < <(git diff --name-only "$base" HEAD -- packages/)
          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No packages changed in packages/; skipping package lint."
            exit 0
          fi

          mapfile -t packages < <(
            printf '%s\n' "${changed_files[@]}" | awk -F/ '
              NF >= 3 && $1 == "packages" {
                if (NF >= 4) print $3
                else if (NF == 3) print $2
              }' | sort -u
          )

          valid_pkgs=()
          for pkg in "${packages[@]}"; do
            if [[ -d "packages/${pkg:0:1}/${pkg}" || -d "packages/${pkg}" ]]; then
              valid_pkgs+=("$pkg")
            fi
          done

          if [[ ${#valid_pkgs[@]} -eq 0 ]]; then
            echo "No packages changed in packages/; skipping package lint."
            exit 0
          fi

          echo "Linting packages: ${valid_pkgs[*]}"
          exec scripts/ci/lint-packages.sh "${valid_pkgs[@]}"
