name: Lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "packages/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    if: "!startsWith(github.head_ref, 'aur/') && !startsWith(github.head_ref, 'update/')"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          mapfile -t files < <(git ls-files 'scripts/*.sh' 'scripts/**/*.sh')
          shellcheck --external-sources --severity=style "${files[@]}"

  pkgbuild:
    name: PKGBUILD sanity
    if: "!startsWith(github.head_ref, 'aur/') && !startsWith(github.head_ref, 'update/')"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@v7
      - name: Check packages
        run: |
          useradd -m builder
          scripts/ci/lint-packages.sh
