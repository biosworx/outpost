name: Build builder image

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - ".github/workflows/builder-image.yml"
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC, before the daily update check
  workflow_dispatch:

concurrency:
  group: builder-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to and prune ghcr.io/<owner>/<repo>-builder

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # Keep this many dated versions for rollback; older ones are deleted.
      KEEP_VERSIONS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-builder"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Named after the repository, so a rename moves the image with it (the
      # workflows reference ghcr.io/${{ github.repository }}-builder).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Containerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old image versions
        run: |
          package="${GITHUB_REPOSITORY#*/}-builder"
          gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions" \
            --jq '.[] | "\(.created_at)\t\(.id)"' |
            sort -r | tail -n +"$((KEEP_VERSIONS + 1))" | cut -f2 |
            while read -r id; do
              gh api -X DELETE "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions/${id}"
              echo "deleted version ${id}"
            done
