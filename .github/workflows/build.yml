name: Build and publish [aurstrich]
run-name: ${{ inputs.packages && format('Build {0}', inputs.packages) || github.event.head_commit.message || 'Build changed packages' }}

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, "all", or blank to auto-detect'
        required: false
        default: ""
      prune:
        description: "Delete package files no longer referenced by the database"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # detect-changes.sh looks up the last successful run
  packages: read # pull the builder image

# One package per run. When a push (or a manual run) selects several, this
# run only starts one run per package and builds nothing itself. Builds only
# read the database; the publish job is the single writer.
jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # dispatch-builds.sh starts the per-package runs
    outputs:
      package: ${{ steps.detect.outputs.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_FILE: build.yml
          BRANCH: main
        run: scripts/ci/detect-changes.sh

      - name: Start one run per package
        if: steps.detect.outputs.dispatch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.detect.outputs.dispatch }}
          WORKFLOW_FILE: build.yml
          BRANCH: main
        run: scripts/ci/dispatch-builds.sh

  build:
    name: Build ${{ needs.detect.outputs.package }}
    needs: detect
    if: needs.detect.outputs.package != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # archlinux:base-devel with the tooling preinstalled (container/Containerfile).
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --privileged

    env:
      OUT_DIR: ${{ github.workspace }}/.repo
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}

    steps:
      - name: Update system
        run: |
          pacman-key --init
          pacman -Syu --noconfirm

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare build user
        run: scripts/ci/setup-builder.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/ci/setup-gpg.sh

      # Read-only: lets build-packages.sh skip versions already published.
      - name: Pull repository database
        run: scripts/ci/publish.sh pull

      - name: Build ${{ needs.detect.outputs.package }}
        id: build
        env:
          PACKAGES: ${{ needs.detect.outputs.package }}
        run: scripts/ci/build-packages.sh

      # Artifacts reject ':' in file names, which packages with an epoch have
      # (rockchip-mpp-1:1.1.0-1-...), so the files travel inside one tar.
      - name: Bundle package
        if: steps.build.outputs.built != ''
        run: |
          cd .repo/.pkgdest
          tar -cf ../packages.tar -- *.pkg.tar.zst *.pkg.tar.zst.sig

      - name: Upload package
        if: steps.build.outputs.built != ''
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ needs.detect.outputs.package }}
          # Signed packages (.pkg.tar.zst and .sig). Already zstd-compressed.
          path: .repo/packages.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Report failure
        if: steps.build.outputs.failed != ''
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
        run: |
          echo "::error::Failed to build ${PACKAGE}"
          exit 1

      - name: Stop gpg-agent
        if: always()
        run: |
          if id builder >/dev/null 2>&1; then
            sudo -u builder -H GNUPGHOME=/home/builder/.gnupg gpgconf --kill gpg-agent || true
          fi

  publish:
    name: Publish
    needs: [detect, build]
    if: needs.detect.outputs.package != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    permissions:
      contents: read
      actions: write # delete this run's package artifact once published
      packages: read # pull the builder image

    # One writer to the repository database at a time; shared with the
    # remove-package workflow. Queue, never cancel: with one run per package,
    # several publish jobs often wait at once, and the default queue keeps
    # only one pending job, cancelling the rest.
    concurrency:
      group: pacman-repo-sync
      cancel-in-progress: false
      queue: max

    env:
      OUT_DIR: ${{ github.workspace }}/.repo
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}

    steps:
      - name: Update system
        run: |
          pacman-key --init
          pacman -Syu --noconfirm

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare build user
        run: scripts/ci/setup-builder.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/ci/setup-gpg.sh

      - name: Download built packages
        uses: actions/download-artifact@v8
        # Nothing to download when the version was already published.
        continue-on-error: true
        with:
          pattern: pkg-*
          path: .repo/.artifacts

      - name: Collect built packages
        id: collect
        run: |
          mkdir -p "$OUT_DIR/.pkgdest" "$OUT_DIR/.artifacts"
          find "$OUT_DIR/.artifacts" -name packages.tar -exec tar -xf {} -C "$OUT_DIR/.pkgdest" \;
          find "$OUT_DIR/.pkgdest" -maxdepth 1 -name '*.pkg.tar.zst' | sort >"$OUT_DIR/.built"
          sed 's|.*/||' "$OUT_DIR/.built"
          echo "count=$(wc -l <"$OUT_DIR/.built")" >>"$GITHUB_OUTPUT"

      - name: Pull repository database
        if: steps.collect.outputs.count != '0'
        run: scripts/ci/publish.sh pull

      - name: Update database and upload
        id: publish
        if: steps.collect.outputs.count != '0'
        run: scripts/ci/publish.sh push

      - name: Purge Cloudflare cache
        if: steps.publish.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: scripts/ci/purge-cache.sh

      - name: Prune superseded packages
        if: steps.publish.outcome == 'success'
        env:
          PRUNE: ${{ github.event_name == 'workflow_dispatch' && !inputs.prune && '0' || '1' }}
        run: scripts/ci/publish.sh prune

      # The artifact is only the hand-off from the build job; delete it
      # whatever happened. After a failed publish, re-run all jobs: the
      # package has to be built again.
      - name: Delete package artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("pkg-")) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              echo "deleted artifact ${id}"
            done

      - name: Stop gpg-agent
        if: always()
        run: |
          if id builder >/dev/null 2>&1; then
            sudo -u builder -H GNUPGHOME=/home/builder/.gnupg gpgconf --kill gpg-agent || true
          fi
