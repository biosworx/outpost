name: Build and publish [aurstrich]

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, "all", or blank to auto-detect'
        required: false
        default: ""
      prune:
        description: "Delete package files no longer referenced by the database"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # detect-changes.sh looks up the last successful run

# Each package builds in its own job, so one failed or lost runner costs only
# that package. Builds only read the database; the publish job is the single
# writer and collects every package that built.
jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_FILE: build.yml
          BRANCH: main
        run: scripts/ci/detect-changes.sh

  build:
    name: Build ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.matrix) }}

    env:
      OUT_DIR: ${{ github.workspace }}/.repo
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}

    steps:
      - name: Install tooling
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git rclone

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare build user
        run: scripts/ci/setup-builder.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/ci/setup-gpg.sh

      # Read-only: lets build-packages.sh skip versions already published.
      - name: Pull repository database
        run: scripts/ci/publish.sh pull

      - name: Build ${{ matrix.package }}
        id: build
        env:
          PACKAGES: ${{ matrix.package }}
        run: scripts/ci/build-packages.sh

      - name: Upload package
        if: steps.build.outputs.built != ''
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          # Signed packages (.pkg.tar.zst and .sig). Already zstd-compressed.
          path: .repo/.pkgdest/*.pkg.tar.zst*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Report failure
        if: steps.build.outputs.failed != ''
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "::error::Failed to build ${PACKAGE}"
          exit 1

      - name: Stop gpg-agent
        if: always()
        run: |
          if id builder >/dev/null 2>&1; then
            sudo -u builder -H GNUPGHOME=/home/builder/.gnupg gpgconf --kill gpg-agent || true
          fi

  publish:
    name: Publish
    needs: [detect, build]
    # Publish whatever built, even when other packages failed.
    if: ${{ !cancelled() && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    # One writer to the repository database at a time; shared with the
    # remove-package workflow. Queue, never cancel.
    concurrency:
      group: pacman-repo-sync
      cancel-in-progress: false

    env:
      OUT_DIR: ${{ github.workspace }}/.repo
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
      RCLONE_CONFIG_B2_HARD_DELETE: "false"

    steps:
      - name: Install tooling
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git rclone jq

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare build user
        run: scripts/ci/setup-builder.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/ci/setup-gpg.sh

      - name: Download built packages
        uses: actions/download-artifact@v8
        # Nothing to download when every package failed or was skipped.
        continue-on-error: true
        with:
          pattern: pkg-*
          merge-multiple: true
          path: .repo/.pkgdest

      - name: Collect built packages
        id: collect
        run: |
          mkdir -p "$OUT_DIR/.pkgdest"
          find "$OUT_DIR/.pkgdest" -maxdepth 1 -name '*.pkg.tar.zst' | sort >"$OUT_DIR/.built"
          sed 's|.*/||' "$OUT_DIR/.built"
          echo "count=$(wc -l <"$OUT_DIR/.built")" >>"$GITHUB_OUTPUT"

      - name: Pull repository database
        if: steps.collect.outputs.count != '0'
        run: scripts/ci/publish.sh pull

      - name: Update database and upload
        id: publish
        if: steps.collect.outputs.count != '0'
        run: scripts/ci/publish.sh push

      - name: Purge Cloudflare cache
        if: steps.publish.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: scripts/ci/purge-cache.sh

      - name: Prune superseded packages
        if: steps.publish.outcome == 'success'
        env:
          PRUNE: ${{ github.event_name == 'workflow_dispatch' && !inputs.prune && '0' || '1' }}
        run: scripts/ci/publish.sh prune

      - name: Stop gpg-agent
        if: always()
        run: |
          if id builder >/dev/null 2>&1; then
            sudo -u builder -H GNUPGHOME=/home/builder/.gnupg gpgconf --kill gpg-agent || true
          fi
