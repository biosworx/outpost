name: Build [aurstrich]
run-name: ${{ inputs.packages && format('Build {0}', inputs.packages) || github.event.head_commit.message || 'Build changed packages' }}

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, "all", or blank to auto-detect'
        required: false
        default: ""
      prune:
        description: "Delete package files no longer referenced by the database"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # detect-changes.sh looks up the last successful run

# One package per run. When a push (or a manual run) selects several, this
# run only starts one run per package and builds nothing itself. Builds only
# read the database and run in parallel; when a run finishes, publish.yml
# adds its package to the database, one run at a time.
jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # dispatch-builds.sh starts the per-package runs
    outputs:
      package: ${{ steps.detect.outputs.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_FILE: build.yml
          BRANCH: main
        run: scripts/ci/detect-changes.sh

      - name: Start one run per package
        if: steps.detect.outputs.dispatch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.detect.outputs.dispatch }}
          WORKFLOW_FILE: build.yml
          BRANCH: main
        run: scripts/ci/dispatch-builds.sh

  build:
    name: Build ${{ needs.detect.outputs.package }}
    needs: detect
    if: needs.detect.outputs.package != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
      options: --privileged

    env:
      OUT_DIR: ${{ github.workspace }}/.repo
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}

    steps:
      - name: Install tooling
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git rclone

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare build user
        run: scripts/ci/setup-builder.sh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/ci/setup-gpg.sh

      # Read-only: lets build-packages.sh skip versions already published.
      - name: Pull repository database
        run: scripts/ci/publish.sh pull

      - name: Build ${{ needs.detect.outputs.package }}
        id: build
        env:
          PACKAGES: ${{ needs.detect.outputs.package }}
        run: scripts/ci/build-packages.sh

      - name: Upload package
        if: steps.build.outputs.built != ''
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ needs.detect.outputs.package }}
          # Signed packages (.pkg.tar.zst and .sig). Already zstd-compressed.
          path: .repo/.pkgdest/*.pkg.tar.zst*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # publish.yml cannot see this run's inputs, so pass them along.
      - name: Save publish options
        if: steps.build.outputs.built != ''
        env:
          PRUNE: ${{ github.event_name == 'workflow_dispatch' && !inputs.prune && '0' || '1' }}
        run: |
          mkdir -p .repo/options
          echo "PRUNE=${PRUNE}" >.repo/options/publish.env

      - name: Upload publish options
        if: steps.build.outputs.built != ''
        uses: actions/upload-artifact@v7
        with:
          name: publish-options
          path: .repo/options/publish.env
          if-no-files-found: error
          retention-days: 1

      - name: Report failure
        if: steps.build.outputs.failed != ''
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
        run: |
          echo "::error::Failed to build ${PACKAGE}"
          exit 1

      - name: Stop gpg-agent
        if: always()
        run: |
          if id builder >/dev/null 2>&1; then
            sudo -u builder -H GNUPGHOME=/home/builder/.gnupg gpgconf --kill gpg-agent || true
          fi
